name: Sync Troubleshooting Skill
run-name: "Sync troubleshooting skill references #${{ github.run_number }} — triggered by ${{ github.actor }} (${{ github.event_name }})"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      auto-merge:
        description: "Automatically enable auto-merge for the created pull request"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Sync reference docs into skill
        uses: netcracker/qubership-workflow-hub/actions/sync-files-action@27fd7674286e5f561a6fd8277f2f389ff96ddb9e  # v2.6.0
        with:
          files: |
            [
              { "from": "docs/public/troubleshooting.md", "to": "agent-packages/troubleshoot-airflow/.apm/skills/troubleshoot-airflow/references/troubleshooting.md" },
              { "from": "docs/public/monitoring.md", "to": "agent-packages/troubleshoot-airflow/.apm/skills/troubleshoot-airflow/references/monitoring.md" }
            ]
          title: "chore: sync troubleshooting skill references"
          commit-message: "chore: sync troubleshooting skill references"
          auto-merge: ${{ inputs.auto-merge || 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}
