{{- /*
#---Qubership custom change: Redirect HTTPRoute and BackendTLSPolicy for custom TLS scenarios---
*/}}

{{- if and .Values.apiServer.enabled .Values.apiServer.httpRoute.redirectRoute.enabled -}}
{{- $fullname := (include "airflow.fullname" .) }}
{{- $Global := . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-api-server-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    tier: airflow
    component: airflow-httproute
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    {{- if or .Values.labels .Values.apiServer.labels }}
      {{- mustMerge .Values.apiServer.labels .Values.labels | toYaml | nindent 4 }}
    {{- end }}
  {{- with .Values.apiServer.httpRoute.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.apiServer.httpRoute.redirectRoute.parentRefs }}
  parentRefs:
    {{- tpl (toYaml .) $Global | nindent 4 }}
  {{- end }}
  {{- with .Values.apiServer.httpRoute.hostnames }}
  hostnames:
    {{- range . }}
    - {{ tpl . $Global | quote }}
    {{- end }}
  {{- end }}
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
{{- end }}

---

{{- if and .Values.apiServer.enabled .Values.apiServer.httpRoute.backendTLSPolicy.enabled -}}
{{- $fullname := (include "airflow.fullname" .) }}
{{- $Global := . }}
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: {{ $fullname }}-api-server
  namespace: {{ .Release.Namespace }}
  labels:
    tier: airflow
    component: airflow-httproute
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    {{- if or .Values.labels .Values.apiServer.labels }}
      {{- mustMerge .Values.apiServer.labels .Values.labels | toYaml | nindent 4 }}
    {{- end }}
  {{- with .Values.apiServer.httpRoute.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: {{ $fullname }}-api-server
  validation:
    {{- if .Values.apiServer.httpRoute.backendTLSPolicy.hostname }}
    hostname: {{ tpl .Values.apiServer.httpRoute.backendTLSPolicy.hostname $Global | quote }}
    {{- end }}
    {{- if .Values.apiServer.httpRoute.backendTLSPolicy.subjectAltNames }}
    subjectAltNames:
    {{- toYaml .Values.apiServer.httpRoute.backendTLSPolicy.subjectAltNames | nindent 6 }}
    {{- end }}
    {{- if .Values.apiServer.httpRoute.backendTLSPolicy.caCertificateRefs }}
    caCertificateRefs:
    {{- toYaml .Values.apiServer.httpRoute.backendTLSPolicy.caCertificateRefs | nindent 6 }}
    {{- end }}
    {{- if .Values.apiServer.httpRoute.backendTLSPolicy.wellKnownCACertificates }}
    wellKnownCACertificates: {{ tpl .Values.apiServer.httpRoute.backendTLSPolicy.wellKnownCACertificates $Global | quote }}
    {{- end }}
{{- end }}
