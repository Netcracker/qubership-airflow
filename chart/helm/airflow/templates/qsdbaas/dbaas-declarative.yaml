{{- /* Qubership custom change: Declarative DBaaS resources for the dbaas-operator--- */ -}}
{{- if .Values.dbaasDeclarative.enabled }}
{{- $declarative := .Values.dbaasDeclarative }}
{{- $_ := required "dbaasDeclarative.operatorNamespace is required when dbaasDeclarative.enabled is true" $declarative.operatorNamespace }}
{{- $fullname := include "airflow.fullname" . }}
{{- if $declarative.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-dbaas-operator-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-dbaas-operator-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-dbaas-operator-secrets
subjects:
  - kind: ServiceAccount
    name: {{ $declarative.rbac.operatorServiceAccount }}
    namespace: {{ $declarative.operatorNamespace }}
{{- end }}
{{- $useRedis := ne (.Values.executor | toString) "KubernetesExecutor" }}
{{- $pgClassifier := dict "microserviceName" $declarative.postgresql.microserviceName "scope" "service" "isServiceDb" "true" }}
{{- $redisClassifier := dict "microserviceName" $declarative.redis.microserviceName "scope" "service" "isServiceDb" "true" }}
{{- include "airflow.dbaas.database" (dict "ctx" . "name" (printf "%s-postgresql" $fullname) "type" "postgresql" "classifier" $pgClassifier "namePrefix" $declarative.postgresql.namePrefix "secretName" (include "airflow.dbaas.pgSecretName" .)) }}
{{- if $useRedis }}
{{- include "airflow.dbaas.database" (dict "ctx" . "name" (printf "%s-redis" $fullname) "type" "redis" "classifier" $redisClassifier "namePrefix" $declarative.redis.namePrefix "secretName" (include "airflow.dbaas.redisSecretName" .)) }}
{{- end }}
{{- /* Connections come from the same qs_secrets_backend_params that config.secrets.backend_kwargs uses. The backend resolves only PostgreSQL. */ -}}
{{- range $key, $params := (.Values.qs_secrets_backend_params | default dict) }}
{{- if and (hasSuffix "_dbaas" $key) (eq (toString $params.type) "postgresql") }}
{{- $connectionName := trimSuffix "_dbaas" $key | lower | replace "_" "-" }}
{{- $classifier := required (printf "qs_secrets_backend_params.%s.classifier is required" $key) $params.classifier }}
{{- if and $classifier.namespace (ne $classifier.namespace $.Release.Namespace) }}
{{- fail (printf "qs_secrets_backend_params.%s.classifier.namespace is %q, but the dbaas-operator accepts only the release namespace %q" $key $classifier.namespace $.Release.Namespace) }}
{{- end }}
{{- include "airflow.dbaas.database" (dict "ctx" $ "name" (printf "%s-%s" $fullname $connectionName) "type" "postgresql" "classifier" $classifier "namePrefix" $params.namePrefix "settings" $params.settings "secretName" (printf "%s-dbaas-%s" $fullname $connectionName)) }}
{{- end }}
{{- end }}
{{- $services := list }}
{{- range $component := list "api-server" "create-user-job" "dag-processor" "database-cleanup" "migrate-database-job" "scheduler" "worker" "triggerer" "flower" }}
{{- $services = append $services (dict "name" (printf "%s-%s" $fullname $component) "roles" (list "admin")) }}
{{- end }}
{{- if and (index (default dict .Values.integrationTests) "enabled") (index (default dict .Values.integrationTests) "dbaasM2mEnabled") }}
{{- $services = append $services (dict "name" (.Values.integrationTests.serviceAccount.name | default "airflow-integration-tests") "roles" (list "admin")) }}
{{- end }}
{{- $policyOwners := dict "postgresql" $declarative.postgresql.microserviceName }}
{{- if and $useRedis (ne $declarative.redis.microserviceName $declarative.postgresql.microserviceName) }}
{{- $_ := set $policyOwners "redis" $declarative.redis.microserviceName }}
{{- end }}
{{- range $suffix, $microserviceName := $policyOwners }}
---
apiVersion: dbaas.netcracker.com/v1
kind: DatabaseAccessPolicy
metadata:
  name: {{ $fullname }}-{{ $suffix }}
  namespace: {{ $.Release.Namespace }}
  labels:
    release: {{ $.Release.Name }}
spec:
  operatorNamespace: {{ $declarative.operatorNamespace | quote }}
  microserviceName: {{ $microserviceName | quote }}
  services: {{- toYaml $services | nindent 4 }}
  disableGlobalPermissions: false
{{- end }}
{{- end }}
